[project]
name = "knottiness"
version = "0.1.0"
description = "Vector reconstructions of P. G. Tait's knot tables: 'Tenfold Knottiness' (1885) and 'The first seven orders of knottiness'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pillow>=10.1",     # wheels include OpenJPEG, needed for the Internet Archive .jp2 files
    "cairosvg>=2.7",    # review sheets (rasterising SVGs); needs the system Cairo library
    "shapely>=2.2.0",
    "pyyaml>=6.0.3",
    "opencv-python-headless>=5.0.0.93",
    "fonttools>=4.50",
    "pypdf>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tait"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
